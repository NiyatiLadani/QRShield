# Render.com Blueprint - QRShield Backend (100% Free Single Web Service)
# Runs Django with in-process Celery execution (No paid workers, No paid Redis required)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: qrshield-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CELERY_ALWAYS_EAGER
        value: "True"
      - key: GOOGLE_SAFE_BROWSING_API_KEY
        value: "AIzaSyDxWx4KW2n6s_ymXggM1uISJESjasbbU6o"
      - key: VIRUSTOTAL_API_KEY
        value: "2b3ba5e72252a530b7048632ea64ca7ff01d2f1a280c33a7265059c91193e1c9"
      - key: URLHAUS_API_KEY
        value: ""
